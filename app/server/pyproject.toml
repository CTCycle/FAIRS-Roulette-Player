[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "fairs-server"
version = "3.0.0"
requires-python = ">=3.14"

dependencies = [
    "fastapi==0.128.0",
    "uvicorn[standard]>=0.40.0",
    "numpy==2.4.6",
    "pandas==3.0.5",
    "torch==2.9.0+cu130",    
    "keras==3.13.2",
    "SQLAlchemy==2.0.51",
    "alembic==1.19.0",
    "psycopg[binary]==3.3.4",
    "python-dotenv==1.2.1", 
    "python-multipart>=0.0.21", 
    "gymnasium==1.2.3",
    "openpyxl==3.1.5",
    "pillow==12.0.0"
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "playwright>=1.58.0",
    "pytest-playwright>=0.5.0",
    "httpx>=0.28.0",
    "ruff==0.15.22"
]

[tool.hatch.build.targets.wheel]
packages = ["server"] 

[tool.ruff]
cache-dir = "../tests/cache/ruff"

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true 

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
# torchvision = { index = "pytorch-cu130" }
# torchaudio  = { index = "pytorch-cu130" }
