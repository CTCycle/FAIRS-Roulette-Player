name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  backend-validation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fairs
          POSTGRES_PASSWORD: fairs
          POSTGRES_DB: fairs
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U fairs -d fairs"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    env:
      PYTHONPATH: app
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        working-directory: app/server
        run: uv sync --extra test
      - name: Ruff
        run: uv --project app/server run ruff check app/server app/tests
      - name: Unit tests
        run: uv --project app/server run pytest -q app/tests/unit
      - name: Alembic history and model consistency
        working-directory: app/server
        run: uv run alembic -c alembic.ini heads
      - name: OpenAPI snapshot check
        run: uv --project app/server run python app/scripts/export_openapi.py --check
      - name: Persistence contract
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://fairs:fairs@localhost:5432/fairs
        run: uv --project app/server run pytest -q app/tests/e2e/test_persistence_contract.py
