name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  backend-validation:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: app
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        working-directory: app/server
        run: uv sync --extra test
      - name: Ruff
        run: uv --project app/server run ruff check app/server app/tests
      - name: Unit tests
        run: uv --project app/server run pytest -q app/tests/unit
      - name: OpenAPI check
        run: uv --project app/server run python -c "from server.app import app; app.openapi()"
