name: Desktop Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: fairs-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build Windows artifacts
        shell: cmd
        run: release\tauri\build_with_tauri.bat
      - name: Verify portable contents
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File release/tauri/scripts/verify-artifacts.ps1
      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: fairs-windows-release
          path: release/windows/FAIRS-*
          if-no-files-found: error
      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/windows/FAIRS-*
